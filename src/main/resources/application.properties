# Server Configuration
server.port=8082

# Application Name
spring.application.name=PeopleInfo

# ============================================================
# MySQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/peopleinfo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=^j61%U6g1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration
app.jwt.secret=PeopleInfoSecretKey2024VeryLongAndSecureJWTSecretKeyForSigningTokens
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.peopleinfo=INFO
logging.level.org.springframework.security=WARN

# ============================================================
# Session & Cookie Configuration
# ============================================================
# The following properties configure the JSESSIONID cookie that 
# Spring Security uses to track authenticated users across requests.

# Ensure the session cookie is HttpOnly. This is CRUCIAL for security 
# because it prevents malicious JavaScript (XSS attacks) from reading 
# the session token and hijacking the user's account.
server.servlet.session.cookie.http-only=true

# Ensure the cookie is only sent over HTTPS connections (Prevents interception). 
# Note: Set to false here for local development, but MUST be true in production.
server.servlet.session.cookie.secure=false

# Set session timeout (e.g., 24 hours). If the user is inactive, the cookie expires.
server.servlet.session.timeout=24h
