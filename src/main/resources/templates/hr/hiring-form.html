<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Job Posting Form – PeopleInfo</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: hr-sidebar}"></div>
  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="page-title" th:text="${isNew} ? 'New Job Posting' : 'Edit Job Posting'"></div>
        <div class="page-subtitle">Define the hiring requirement details</div>
      </div>
      <div class="topbar-actions">
        <a th:href="@{/hr/hiring}" class="btn btn-outline"><i class="ri-arrow-left-line"></i> Back</a>
      </div>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <span class="card-title"><i class="ri-briefcase-line" style="color:var(--primary);"></i> Job Details</span>
        </div>
        <div class="card-body">
          <form th:action="@{/hr/hiring/save}" method="POST" th:object="${job}">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Job Title *</label>
                <input type="text" th:field="*{jobTitle}" class="form-control" required placeholder="e.g. Senior Developer"/>
              </div>
              <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control" list="deptList" placeholder="Engineering"/>
                <datalist id="deptList">
                  <option th:each="d : ${departments}" th:value="${d}"></option>
                </datalist>
              </div>
              <div class="form-group">
                <label class="form-label">Experience Level</label>
                <select th:field="*{experienceLevel}" class="form-select">
                  <option value="">Select level</option>
                  <option th:each="el : ${experienceLevels}" th:value="${el}" th:text="${el}"></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Job Type</label>
                <select th:field="*{jobType}" class="form-select">
                  <option value="">Select type</option>
                  <option th:each="jt : ${jobTypes}" th:value="${jt}" th:text="${jt}"></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Positions Available</label>
                <input type="number" th:field="*{positionsAvailable}" class="form-control" min="1" placeholder="1"/>
              </div>
              <div class="form-group">
                <label class="form-label">Location</label>
                <input type="text" th:field="*{location}" class="form-control" placeholder="New York, NY (Hybrid)"/>
              </div>
              <div class="form-group">
                <label class="form-label">Salary Min ($)</label>
                <input type="number" th:field="*{salaryRangeMin}" class="form-control" placeholder="60000"/>
              </div>
              <div class="form-group">
                <label class="form-label">Salary Max ($)</label>
                <input type="number" th:field="*{salaryRangeMax}" class="form-control" placeholder="90000"/>
              </div>
              <div class="form-group">
                <label class="form-label">Application Deadline</label>
                <input type="date" th:field="*{deadlineDate}" class="form-control"/>
              </div>
              <div class="form-group" th:if="${!isNew}">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                  <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Job Description *</label>
              <textarea th:field="*{description}" class="form-control" rows="4" required
                        placeholder="Describe the role and what makes it exciting..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Requirements</label>
              <textarea th:field="*{requirements}" class="form-control" rows="4"
                        placeholder="List key qualifications, skills, education (one per line)..."></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Responsibilities</label>
              <textarea th:field="*{responsibilities}" class="form-control" rows="4"
                        placeholder="Describe day-to-day responsibilities (one per line)..."></textarea>
            </div>

            <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1rem;">
              <a th:href="@{/hr/hiring}" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-primary">
                <i class="ri-save-line"></i>
                <span th:text="${isNew} ? 'Post Job' : 'Save Changes'"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
