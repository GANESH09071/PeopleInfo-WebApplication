<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timesheets – PeopleInfo</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: hr-sidebar}"></div>
  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="page-title">Timesheets</div>
        <div class="page-subtitle">Review employee work hours</div>
      </div>
      <div class="topbar-actions">
        <form th:action="@{/hr/timesheets}" method="GET" style="display:flex;gap:.5rem;align-items:center;">
          <input type="text" name="search" class="form-control" placeholder="Search by Name or ID..." th:value="${search}" style="width:250px;"/>
          <button type="submit" class="btn btn-primary"><i class="ri-search-line"></i> Search</button>
          <a th:href="@{/hr/timesheets}" class="btn btn-outline"><i class="ri-refresh-line"></i></a>
        </form>
      </div>
    </div>

    <div class="page-body">
      <div th:if="${success}" class="alert alert-success"><i class="ri-checkbox-circle-line"></i> <span th:text="${success}"></span></div>
      <div th:if="${error}" class="alert alert-danger"><i class="ri-error-warning-line"></i> <span th:text="${error}"></span></div>

      <!-- Live Timer Widget for HR -->
      <div class="card" style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; padding: 2rem;">
        <div>
          <div style="font-size: 1.25rem; font-weight: 600; color: var(--text);">My Timesheet Session</div>
          <div style="color: var(--muted);">Click check in to start tracking your time</div>
        </div>
        <div style="display: flex; align-items: center; gap: 2rem;">
          <div id="liveTimer" style="font-size: 2.5rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums;"
               th:data-tracking="${activeTimesheet != null ? activeTimesheet.isTracking : false}"
               th:data-accumulated="${activeTimesheet != null ? activeTimesheet.accumulatedSeconds : 0}"
               th:data-last-checkin="${activeTimesheet != null && activeTimesheet.lastCheckInTime != null ? activeTimesheet.lastCheckInTime.toString() : ''}">
            00:00:00
          </div>
          
          <form th:if="${activeTimesheet == null || !activeTimesheet.isTracking}" th:action="@{/hr/timesheets/checkin}" method="POST" style="margin: 0;">
            <button type="submit" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;">
              <i class="ri-play-circle-line"></i> Check In
            </button>
          </form>
          
          <form th:if="${activeTimesheet != null && activeTimesheet.isTracking}" th:action="@{/hr/timesheets/checkout}" method="POST" style="margin: 0;">
            <button type="submit" class="btn btn-danger" style="padding: 1rem 2rem; font-size: 1.1rem;">
              <i class="ri-stop-circle-line"></i> Check Out
            </button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">All Timesheets</span>
          <span class="badge badge-primary" th:text="${timesheets.size()} + ' entries'"></span>
        </div>
        <div th:if="${#lists.isEmpty(timesheets)}">
          <div class="empty-state"><i class="ri-time-line"></i><p>No timesheet entries found.</p></div>
        </div>
        <div class="table-wrap" th:if="${!#lists.isEmpty(timesheets)}">
          <table>
            <thead><tr>
              <th>Employee</th><th>Date</th><th>Check In</th><th>Check Out</th>
              <th>Hours</th><th>Project</th><th>Status</th>
            </tr></thead>
            <tbody>
              <tr th:each="ts : ${timesheets}">
                <td>
                  <div style="display:flex;align-items:center;gap:.6rem;">
                    <div class="user-avatar-sm" style="width:32px;height:32px;font-size:.75rem;"
                         th:text="${ts.employee.firstName.substring(0,1)} + ${ts.employee.lastName.substring(0,1)}"></div>
                    <div>
                      <div style="font-weight:600;font-size:.875rem;" th:text="${ts.employee.fullName}"></div>
                      <div class="text-sm text-muted" th:text="${ts.employee.department}"></div>
                    </div>
                  </div>
                </td>
                <td style="font-weight:500;" th:text="${ts.date}"></td>
                <td th:text="${ts.checkIn}"></td>
                <td th:text="${ts.checkOut}"></td>
                <td>
                  <span style="font-weight:700;color:var(--primary);" th:text="${ts.hoursWorked} + 'h'"></span>
                </td>
                <td class="text-sm" th:text="${ts.projectName} ?: '—'"></td>
                <td>
                  <span th:class="${ts.status.name() == 'APPROVED'} ? 'badge badge-success' :
                                  (${ts.status.name() == 'REJECTED'} ? 'badge badge-danger' : 'badge badge-warning')"
                        th:text="${ts.status}"></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
