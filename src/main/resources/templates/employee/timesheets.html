<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Timesheets – PeopleInfo</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: emp-sidebar}"></div>
  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="page-title">My Timesheets</div>
        <div class="page-subtitle">Log and track your work hours</div>
      </div>
      <div class="topbar-actions">
        <!-- Manual logging replaced by live timer -->
      </div>
    </div>

    <div class="page-body">
      <div th:if="${success}" class="alert alert-success"><i class="ri-checkbox-circle-line"></i> <span th:text="${success}"></span></div>
      <div th:if="${error}" class="alert alert-danger"><i class="ri-error-warning-line"></i> <span th:text="${error}"></span></div>

      <!-- Live Timer Widget -->
      <div class="card" style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; padding: 2rem;">
        <div>
          <div style="font-size: 1.25rem; font-weight: 600; color: var(--text);">Today's Session</div>
          <div style="color: var(--muted);">Click check in to start tracking your time</div>
        </div>
        <div style="display: flex; align-items: center; gap: 2rem;">
          <div id="liveTimer" style="font-size: 2.5rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums;"
               th:data-tracking="${activeTimesheet != null ? activeTimesheet.isTracking : false}"
               th:data-accumulated="${activeTimesheet != null ? activeTimesheet.accumulatedSeconds : 0}"
               th:data-last-checkin="${activeTimesheet != null && activeTimesheet.lastCheckInTime != null ? activeTimesheet.lastCheckInTime.toString() : ''}">
            00:00:00
          </div>
          
          <form th:if="${activeTimesheet == null || !activeTimesheet.isTracking}" th:action="@{/employee/timesheets/checkin}" method="POST" style="margin: 0;">
            <button type="submit" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;">
              <i class="ri-play-circle-line"></i> Check In
            </button>
          </form>
          
          <form th:if="${activeTimesheet != null && activeTimesheet.isTracking}" th:action="@{/employee/timesheets/checkout}" method="POST" style="margin: 0;">
            <button type="submit" class="btn btn-danger" style="padding: 1rem 2rem; font-size: 1.1rem;">
              <i class="ri-stop-circle-line"></i> Check Out
            </button>
          </form>
        </div>
      </div>

      <!-- Summary -->
      <div class="stats-grid" style="grid-template-columns:repeat(1, minmax(250px, 350px));margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="ri-time-line"></i></div>
          <div class="stat-info">
            <div class="label">This Month</div>
            <div class="value" th:text="${hoursThisMonth != null ? #numbers.formatDecimal(hoursThisMonth, 1, 1) : '0.0'} + 'h'">0h</div>
            <div class="change">Total hours logged</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Timesheet History</span>
          <span class="badge badge-primary" th:text="${timesheets.size()} + ' entries'"></span>
        </div>
        <div th:if="${#lists.isEmpty(timesheets)}">
          <div class="empty-state"><i class="ri-time-line"></i><p>No timesheets logged yet.</p></div>
        </div>
        <div class="table-wrap" th:if="${!#lists.isEmpty(timesheets)}">
          <table>
            <thead><tr>
              <th>Date</th><th>Check In</th><th>Check Out</th>
              <th>Hours Worked</th><th>Project</th><th>Notes</th>
            </tr></thead>
            <tbody>
              <tr th:each="ts : ${timesheets}">
                <td style="font-weight:600;" th:text="${ts.date}"></td>
                <td th:text="${ts.checkIn}"></td>
                <td th:text="${ts.checkOut}"></td>
                <td><span style="font-weight:700;color:var(--primary);font-size:1rem;"
                          th:text="${ts.hoursWorked != null ? #numbers.formatDecimal(ts.hoursWorked, 1, 1) : '0.0'} + 'h'"></span></td>
                <td class="text-sm" th:text="${ts.projectName} ?: '—'"></td>
                <td class="text-sm text-muted"
                    style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                    th:text="${ts.notes} ?: '—'"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
