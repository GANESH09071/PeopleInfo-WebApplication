<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Leaves – PeopleInfo</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/sidebar :: emp-sidebar}"></div>
  <div class="main-content">

    <div class="topbar">
      <div>
        <div class="page-title">My Leaves</div>
        <div class="page-subtitle">Apply for and track your leave requests</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openModal('leaveModal')">
          <i class="ri-calendar-event-line"></i> Apply for Leave
        </button>
      </div>
    </div>

    <div class="page-body">
      <div th:if="${success}" class="alert alert-success">
        <i class="ri-checkbox-circle-line"></i>
        <span th:text="${success}"></span>
      </div>
      <div th:if="${error}" class="alert alert-danger">
        <i class="ri-error-warning-line"></i>
        <span th:text="${error}"></span>
      </div>

      <!-- Summary Stats -->
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="ri-loader-line"></i></div>
          <div class="stat-info">
            <div class="label">Pending</div>
            <div class="value" th:text="${pendingCount}">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="ri-checkbox-circle-line"></i></div>
          <div class="stat-info">
            <div class="label">Approved</div>
            <div class="value" th:text="${approvedCount}">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><i class="ri-close-circle-line"></i></div>
          <div class="stat-info">
            <div class="label">Rejected</div>
            <div class="value" th:text="${rejectedCount}">0</div>
          </div>
        </div>
      </div>

      <!-- Leave History -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Leave History</span>
          <span class="badge badge-primary" th:text="${leaves.size()} + ' requests'"></span>
        </div>
        <div th:if="${#lists.isEmpty(leaves)}">
          <div class="empty-state" style="padding:2.5rem;">
            <i class="ri-calendar-event-line"></i>
            <p>No leave requests yet. Click "Apply for Leave" to get started.</p>
          </div>
        </div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(leaves)}">
          <table>
            <thead>
              <tr>
                <th>Leave Type</th>
                <th>From</th>
                <th>To</th>
                <th>Days</th>
                <th>Reason</th>
                <th>Status</th>
                <th>HR Comments</th>
                <th>Applied On</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="leave : ${leaves}">
                <td><span class="badge badge-info" th:text="${leave.leaveType}"></span></td>
                <td style="font-weight:500;" th:text="${leave.startDate}"></td>
                <td th:text="${leave.endDate}"></td>
                <td><strong th:text="${leave.totalDays}"></strong></td>
                <td class="text-sm text-muted"
                    style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                    th:text="${leave.reason != null ? leave.reason : '—'}"></td>
                <td>
                  <span th:if="${leave.status.name() == 'APPROVED'}"
                        class="badge badge-success">APPROVED</span>
                  <span th:if="${leave.status.name() == 'REJECTED'}"
                        class="badge badge-danger">REJECTED</span>
                  <span th:if="${leave.status.name() == 'PENDING'}"
                        class="badge badge-warning">PENDING</span>
                </td>
                <td class="text-sm text-muted"
                    th:text="${leave.hrComments != null ? leave.hrComments : '—'}"></td>
                <td class="text-sm text-muted"
                    th:text="${leave.appliedOn != null ? leave.appliedOn.toLocalDate().toString() : '—'}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Apply Leave Modal -->
<div class="modal-overlay" id="leaveModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">
        <i class="ri-calendar-event-line"></i> Apply for Leave
      </span>
      <button class="btn btn-outline btn-sm btn-icon" onclick="closeModal('leaveModal')">
        <i class="ri-close-line"></i>
      </button>
    </div>
    <form th:action="@{/employee/leaves/apply}" method="POST">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Leave Type *</label>
          <select name="leaveType" class="form-select" required>
            <option value="">-- Select Leave Type --</option>
            <option th:each="type : ${leaveTypes}" th:value="${type.name()}" th:text="${type.name()}"></option>
          </select>
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Start Date *</label>
            <input type="date" name="startDate" class="form-control"
                   required th:min="${todayStr}"/>
          </div>
          <div class="form-group">
            <label class="form-label">End Date *</label>
            <input type="date" name="endDate" class="form-control"
                   required th:min="${todayStr}"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Reason</label>
          <textarea name="reason" class="form-control" rows="3"
                    placeholder="Briefly describe the reason for your leave..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('leaveModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">
          <i class="ri-send-plane-line"></i> Submit Request
        </button>
      </div>
    </form>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
