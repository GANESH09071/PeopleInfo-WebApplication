<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – PeopleInfo</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-icon"><i class="ri-team-fill"></i></div>
        <h1>PeopleInfo</h1>
        <p>Employee Management System</p>
      </div>

      <div th:if="${error}" class="alert alert-danger">
        <i class="ri-error-warning-line"></i> <span th:text="${error}"></span>
      </div>
      <div th:if="${message}" class="alert alert-success">
        <i class="ri-checkbox-circle-line"></i> <span th:text="${message}"></span>
      </div>
      <div th:if="${success}" class="alert alert-success">
        <i class="ri-checkbox-circle-line"></i> <span th:text="${success}"></span>
      </div>

      <form method="POST" th:action="@{/login}">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="you@company.com" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100" style="justify-content:center;padding:.75rem;">
          <i class="ri-login-circle-line"></i> Sign In
        </button>
      </form>

      <!-- <div class="auth-footer">
        Don't have an account? <a th:href="@{/register}">Create one</a>
      </div> -->

      <!-- Demo credentials hint -->
      <!-- <div style="margin-top:1.5rem;background:#f8fafc;border-radius:8px;padding:1rem;font-size:.78rem;color:#64748b;">
      <strong style="display:block;margin-bottom:.5rem;color:#475569;">Demo Credentials</strong>
      <div><strong>HR:</strong> hr@peopleinfo.com / hr123</div>
      <div style="margin-top:.25rem;"><strong>Employee:</strong> michael.chen@peopleinfo.com / emp123</div>
    </div> -->
    </div>
  </div>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
